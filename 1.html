<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>91 Club Wingo Injector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: black;
            color: lime;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px lime;
            margin: 20px auto;
        }

        h1 {
            font-size: 20px;
        }

        input, button {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid lime;
            background-color: black;
            color: lime;
        }

        button {
            background-color: lime;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        #login-message {
            color: red;
            font-weight: bold;
        }

        #floating-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: lime;
            color: black;
            border-radius: 50%;
            font-size: 16px;
            text-align: center;
            line-height: 60px;
            cursor: pointer;
            box-shadow: 0px 0px 10px lime;
        }

        #floating-window {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 250px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 10px;
            display: none;
            box-shadow: 0px 0px 15px lime;
        }

        #floating-window button {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container" id="login-section">
        <h1>Login</h1>
        <input type="text" id="username" placeholder="Enter Username"><br>
        <input type="password" id="password" placeholder="Enter Password"><br>
        <button onclick="checkLogin()">Login</button>
        <p id="login-message"></p>
    </div>

    <div class="container" id="prediction-section" style="display: none;">
        <h1>Prediction</h1>
        <button onclick="predict()">Predict</button>
        <p id="prediction"></p>
    </div>

    <!-- Floating Injector -->
    <div id="floating-button" onclick="toggleFloatingWindow()">+</div>
    <div id="floating-window">
        <h3>Injector</h3>
        <button onclick="predict()">Predict</button>
        <p id="floating-prediction"></p>
    </div>

    <script>
        function checkLogin() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            if (username === "harsh" && password === "mauryaji") {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("prediction-section").style.display = "block";
            } else {
                document.getElementById("login-message").textContent = "Invalid login!";
            }
        }

        function predict() {
            var colors = ['Red', 'Green'];
            var color = colors[Math.floor(Math.random() * colors.length)];
            var number = (Math.random() * 10).toFixed(2);
            var size = number >= 5 ? "Big" : "Small";

            document.getElementById("prediction").textContent = "Color: " + color + ", Number: " + number + ", " + size;
            document.getElementById("floating-prediction").textContent = "Color: " + color + ", Number: " + number + ", " + size;
        }

        function toggleFloatingWindow() {
            var floatingWindow = document.getElementById("floating-window");
            if (floatingWindow.style.display === "none") {
                floatingWindow.style.display = "block";
            } else {
                floatingWindow.style.display = "none";
            }
        }
    </script>

</body>
</html>
