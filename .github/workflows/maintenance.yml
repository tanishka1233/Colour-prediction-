name: Scheduled maintenance

# This workflow does NOT depend on any persistent runner database.
# It verifies source integrity and configuration only.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python3 -m compileall -q hmx tests scripts

      - name: Configuration and temporary-DB integrity check
        run: python3 scripts/ci_check.py | tee maintenance_report.json

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Upload concise report
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: maintenance_report.json
          if-no-files-found: ignore
