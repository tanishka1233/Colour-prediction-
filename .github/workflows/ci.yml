name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: No dependency installation required
        run: echo "HMX Predictor uses only the Python standard library."

      - name: Syntax check
        run: python3 -m compileall -q hmx tests scripts

      - name: Validate configuration with a temporary database
        run: python3 scripts/ci_check.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Report result
        if: always()
        run: echo "CI job completed with status ${{ job.status }}"
